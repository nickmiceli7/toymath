name: Tests

on:
    push:
        branches: [main]
    pull_request: 

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the repo
              uses: actions/checkout@v7
            
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                python-version: "3.13"
            
            - name: Install code dependencies
              run: |
                python -m pip install --upgrade pip
                pip install ".[test]"
            - name: Run tests
              run: pytest